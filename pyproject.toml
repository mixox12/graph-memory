[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-memory"
version = "1.0.0"
description = "Production Hybrid Graph RAG & Neo4j Knowledge Memory Engine with APOC, GDS, and Local Web UI"
readme = "README.md"
authors = [
    { name = "Gemini Argon 4", email = "argon@local" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Front-Ends",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
neo4j-driver = [
    "neo4j>=5.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
graph-memory = "graph_memory.cli:main"
graphrag = "graph_memory.cli:main"
graph-memory-mcp = "graph_memory.mcp_server:run_mcp_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["graph_memory*"]

[tool.setuptools.package-data]
"*" = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

